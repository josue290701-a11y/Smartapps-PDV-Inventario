<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SmartApps Inventarios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, get, set, update, child
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  window.__fb = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, getDatabase, ref, get, set, update, child };
</script>
<style>
  :root{
    --rojo: #E52420;
    --rojo-oscuro: #A81C19;
    --tinta: #1B1B1E;
    --papel: #F6F4F0;
    --panel: #FFFFFF;
    --linea: #E2DFD8;
    --verde: #1E7A46;
    --ambar: #B7791F;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @font-face{ /* fallback stack only, no external font blocking */ }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--papel);color:var(--tinta);font-family:var(--sans);}
  #app{min-height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--papel);}

  header.topbar{
    background:var(--tinta); color:#fff; padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  header.topbar .brand{display:flex;align-items:center;gap:8px;}
  header.topbar .brand .tag{
    width:10px;height:10px;background:var(--rojo);border-radius:2px;flex:none;
  }
  header.topbar h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;}
  header.topbar .sub{font-size:11px;color:#aaa;margin-top:1px;}
  header.topbar button.icon-btn{
    background:none;border:1px solid #444;color:#ddd;border-radius:6px;
    padding:6px 10px;font-size:12px;font-family:var(--sans);
  }

  main{flex:1;padding:16px;padding-bottom:90px;}

  .card{
    background:var(--panel);border:1px solid var(--linea);border-radius:10px;
    padding:16px;margin-bottom:12px;
  }
  .card h2{font-size:14px;margin:0 0 4px;font-weight:600;}
  .card p.desc{font-size:12.5px;color:#666;margin:0 0 12px;line-height:1.4;}

  .menu-tile{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--linea);border-radius:10px;
    padding:16px;margin-bottom:10px;cursor:pointer;
    transition:border-color .15s ease;
  }
  .menu-tile:active{border-color:var(--rojo);}
  .menu-tile .num{
    font-family:var(--mono);font-size:20px;color:var(--rojo);min-width:34px;
  }
  .menu-tile .txt h3{margin:0 0 2px;font-size:14.5px;}
  .menu-tile .txt p{margin:0;font-size:12px;color:#777;}

  button.btn{
    border:none;border-radius:8px;padding:12px 16px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:var(--sans);
  }
  button.btn-primary{background:var(--rojo);color:#fff;}
  button.btn-primary:active{background:var(--rojo-oscuro);}
  button.btn-secondary{background:#fff;border:1px solid var(--linea);color:var(--tinta);}
  button.btn-ghost{background:none;color:var(--rojo);padding:8px;}
  button.btn-block{width:100%;}
  button:disabled{opacity:.45;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:#777;margin-bottom:5px;text-transform:none;}
  .field input, .field select{
    width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:8px;
    font-size:14px;font-family:var(--sans);background:#fff;
  }

  .scan-row{
    display:flex;gap:8px;
  }
  .scan-row input{flex:1;font-family:var(--mono);}

  .prod-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--linea);
  }
  .prod-row:last-child{border-bottom:none;}
  .prod-row .info h4{margin:0 0 2px;font-size:13.5px;}
  .prod-row .info .code{font-family:var(--mono);font-size:11px;color:#888;}
  .prod-row .qty{font-family:var(--mono);font-size:15px;min-width:34px;text-align:right;}
  .prod-row button.rm{background:none;border:none;color:#c33;font-size:18px;line-height:1;}

  .count-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;border-bottom:1px solid var(--linea);
  }
  .count-row.done{opacity:.5;}
  .count-row .info h4{margin:0 0 2px;font-size:13.5px;}
  .count-row .info .meta{font-family:var(--mono);font-size:11px;color:#888;}
  .count-row .acc{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--verde);min-width:30px;text-align:right;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--tinta);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;z-index:60;opacity:0;transition:opacity .2s ease;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}

  #scan-overlay{
    position:fixed;inset:0;background:#000;z-index:80;display:none;
    flex-direction:column;
  }
  #scan-overlay.show{display:flex;}
  #scan-overlay #reader{flex:1;}
  #scan-overlay .close-scan{
    position:absolute;top:16px;right:16px;z-index:90;
    background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;
    width:36px;height:36px;font-size:18px;
  }
  #scan-overlay .hint{
    position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:12px;
  }

  .diff-pos{color:var(--verde);}
  .diff-neg{color:var(--rojo);}
  .diff-zero{color:#888;}

  .empty{text-align:center;padding:40px 16px;color:#999;font-size:13px;}
  .backline{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .backline button.back{background:none;border:none;font-size:20px;color:var(--tinta);padding:0;}
  .backline .title{font-size:16px;font-weight:600;}

  .badge{
    display:inline-block;font-size:10.5px;font-family:var(--mono);
    padding:2px 7px;border-radius:10px;background:#EFEBE3;color:#7A7568;margin-left:6px;
  }
  .conn-ok{color:var(--verde);} .conn-off{color:#999;}

  footer.tabbar{
    position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:#fff;border-top:1px solid var(--linea);
    display:flex;z-index:30;
  }
  footer.tabbar button{
    flex:1;background:none;border:none;padding:11px 4px;font-size:10.5px;color:#999;
    font-family:var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  footer.tabbar button.active{color:var(--rojo);font-weight:600;}
  footer.tabbar .ic{font-size:16px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="tag"></div>
      <div>
        <h1>SmartApps Inventarios</h1>
        <div class="sub" id="conn-sub">sin conexión al PDV</div>
      </div>
    </div>
    <button class="icon-btn" id="btn-config">Config</button>
  </header>

  <main id="main"></main>

  <div class="toast" id="toast"></div>

  <div id="scan-overlay">
    <button class="close-scan" id="scan-close">✕</button>
    <div id="reader"></div>
    <div class="hint">Apunta al código de barras — también puedes usar una pistola conectada</div>
  </div>

  <footer class="tabbar" id="tabbar">
    <button data-tab="home"><span class="ic">▤</span>Inicio</button>
    <button data-tab="plantillas"><span class="ic">▥</span>Plantillas</button>
    <button data-tab="preinv"><span class="ic">✓</span>Pre-inventario</button>
    <button data-tab="invfull"><span class="ic">◧</span>Inv. completo</button>
  </footer>

</div>

<script>
/* =========================================================================
   SMARTAPPS INVENTARIOS
   App independiente de SmartApps PDV. Se conecta a la MISMA base de datos
   Firebase que el PDV (misma cuenta/tienda) para leer el catálogo/stock
   y, al aplicar un conteo, escribir el ajuste de existencias.
   No toca ventas ni caja: solo lee/ajusta el nodo de productos.

   -------------------------------------------------------------------------
   CONFIGURACIÓN — AJUSTA ESTO A TU PROYECTO REAL
   -------------------------------------------------------------------------
   1) FIREBASE_CONFIG: pega aquí el mismo config del proyecto Firebase
      que usa SmartApps PDV (Firebase console > Configuración del proyecto
      > Tus apps > SDK config).
   2) DB_SCHEMA: indica cómo están guardados los productos en tu PDV.
      Por defecto se asume:
        tiendas/{uid}/productos/{codigoBarras}
          { nombre, existencia, precio, ... }
      Si tu PDV usa otras rutas o nombres de campo, cámbialos aquí una
      sola vez y el resto de la app se ajusta sola.
   ========================================================================= */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDL1DGvn0IHZi5WVcPBOUuN_7cqEo__7So",
  authDomain: "smartapps-pdv.firebaseapp.com",
  databaseURL: "https://smartapps-pdv-default-rtdb.firebaseio.com",
  projectId: "smartapps-pdv",
  storageBucket: "smartapps-pdv.firebasestorage.app",
  messagingSenderId: "531501636778",
  appId: "1:531501636778:web:961e961c8eb55f0ec504d3"
};

// El PDV NO guarda un nodo por producto: guarda todo su estado (ST) como un
// solo bloque en tiendas/{uid}, y dentro de ese bloque "productos" es un
// arreglo de objetos {codigo, nombre, precio, costo, stock}. Por eso aquí
// no hay una ruta directa por código: hay que leer el arreglo completo,
// encontrar el producto por su campo "codigo", y escribir solo el campo
// "stock" de esa posición — nunca el bloque completo, para no pisar
// ventas/clientes/caja que el PDV haya guardado.
const DB_SCHEMA = {
  productosArrayPath: (uid) => `tiendas/${uid}/productos`,
  campoCodigo: "codigo",
  campoNombre: "nombre",
  campoExistencia: "stock",
  campoPrecio: "precio",
};

const LS_KEYS = {
  plantillas: "inv_plantillas",
  sesiones: "inv_sesiones", // historial de conteos aplicados
  auth: "inv_auth_cache",
};

/* ---------------------------- Estado global --------------------------- */

let state = {
  tab: "home",
  view: null,          // vista de detalle activa (crear plantilla, contar, etc.)
  uid: null,
  authReady: false,
  productosPDV: {},     // cache local del catálogo leído del PDV
  plantillas: cargarPlantillas(),
  scanTarget: null,     // callback activo mientras el overlay de cámara está abierto
  html5QrCode: null,
};

function cargarPlantillas(){
  try { return JSON.parse(localStorage.getItem(LS_KEYS.plantillas)) || []; }
  catch(e){ return []; }
}
function guardarPlantillas(){
  localStorage.setItem(LS_KEYS.plantillas, JSON.stringify(state.plantillas));
}

/* ------------------------------ Firebase ------------------------------- */

let fbApp, fbAuth, fbDb;
function initFirebase(){
  const f = window.__fb;
  try{
    fbApp = f.initializeApp(FIREBASE_CONFIG);
    fbAuth = f.getAuth(fbApp);
    fbDb = f.getDatabase(fbApp);
    f.onAuthStateChanged(fbAuth, (user)=>{
      state.authReady = true;
      state.uid = user ? user.uid : null;
      actualizarConexion();
      if(user) cargarCatalogoPDV();
      render();
    });
  }catch(e){
    console.warn("Firebase no configurado todavía:", e.message);
    actualizarConexion();
  }
}

function actualizarConexion(){
  const el = document.getElementById("conn-sub");
  if(state.uid){
    el.textContent = "conectado al PDV";
    el.className = "sub conn-ok";
  } else {
    el.textContent = "sin conexión al PDV — entra en Config";
    el.className = "sub conn-off";
  }
}

async function loginPDV(email, password){
  const f = window.__fb;
  await f.signInWithEmailAndPassword(fbAuth, email, password);
}

async function cargarCatalogoPDV(){
  const f = window.__fb;
  if(!state.uid) return;
  try{
    const snap = await f.get(f.ref(fbDb, DB_SCHEMA.productosArrayPath(state.uid)));
    const crudo = snap.exists() ? snap.val() : {};
    state.productosPDV = {};
    for(const [key, p] of entradasProductos(crudo)){
      const codigo = p && p[DB_SCHEMA.campoCodigo];
      if(!codigo) continue;
      state.productosPDV[codigo] = {
        _key: key,
        nombre: p[DB_SCHEMA.campoNombre] || "(sin nombre)",
        stock: Number(p[DB_SCHEMA.campoExistencia] || 0),
      };
    }
  }catch(e){
    console.warn("No se pudo leer el catálogo del PDV:", e.message);
    toast("No se pudo leer el catálogo del PDV. Revisa la conexión.");
  }
}

// El arreglo "productos" del PDV, al guardarse en Firebase, puede llegar
// como Array (si los índices son consecutivos desde 0) o como objeto con
// llaves no numéricas (si hay huecos). Esta función normaliza ambos casos
// a una lista de [llave, producto] para poder escribir de vuelta en la
// llave correcta sin adivinar posiciones.
function entradasProductos(crudo){
  if(!crudo) return [];
  if(Array.isArray(crudo)) return crudo.map((v,i)=>[String(i), v]).filter(([,v])=>v != null);
  return Object.entries(crudo);
}

function buscarProductoPorCodigo(codigo){
  const p = state.productosPDV[codigo];
  if(!p) return null;
  return { codigo, nombre: p.nombre, existenciaPDV: p.stock };
}

// Lee, justo antes de escribir, el stock y la llave real del producto
// dentro del arreglo de Firebase (no el cache local), para no pisar ventas
// que se hayan hecho en caja mientras se contaba.
async function leerStockEnVivoConLlave(codigo){
  const f = window.__fb;
  if(!state.uid) throw new Error("Sin sesión del PDV");
  const snap = await f.get(f.ref(fbDb, DB_SCHEMA.productosArrayPath(state.uid)));
  const crudo = snap.exists() ? snap.val() : {};
  for(const [key, p] of entradasProductos(crudo)){
    if(p && p[DB_SCHEMA.campoCodigo] === codigo){
      return { key, stock: Number(p[DB_SCHEMA.campoExistencia] || 0) };
    }
  }
  return null; // el producto ya no existe en el PDV
}

async function aplicarAjusteStock(codigo, llave, nuevaCantidad){
  const f = window.__fb;
  if(!state.uid) throw new Error("Sin sesión del PDV");
  const path = `${DB_SCHEMA.productosArrayPath(state.uid)}/${llave}/${DB_SCHEMA.campoExistencia}`;
  await f.set(f.ref(fbDb, path), nuevaCantidad);
}

/* ------------------------------- Utilidades ---------------------------- */

function toast(msg, ms=2200){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), ms);
}

function uid(){ return Math.random().toString(36).slice(2,9); }

/* --------------------------- Escaneo por cámara ------------------------- */

function abrirCamara(onCodigo){
  const overlay = document.getElementById("scan-overlay");
  overlay.classList.add("show");
  const reader = new Html5Qrcode("reader");
  state.html5QrCode = reader;
  reader.start(
    { facingMode: "environment" },
    { fps: 12, qrbox: { width: 260, height: 160 } },
    (decodedText)=>{
      cerrarCamara();
      onCodigo(decodedText.trim());
    },
    ()=>{ /* frame sin código, ignorar */ }
  ).catch(err=>{
    toast("No se pudo abrir la cámara: " + err);
    cerrarCamara();
  });
}
function cerrarCamara(){
  const overlay = document.getElementById("scan-overlay");
  if(state.html5QrCode){
    state.html5QrCode.stop().catch(()=>{}).finally(()=>{
      state.html5QrCode.clear();
      state.html5QrCode = null;
    });
  }
  overlay.classList.remove("show");
}
document.getElementById("scan-close").onclick = cerrarCamara;

/* ---- Entrada por pistola Bluetooth/USB (funciona como teclado + Enter) ---
   Se usa un <input> visible mientras se está en modo "escaneo activo".
   La pistola escribe el código y manda Enter: se captura el evento normal
   de formulario (keydown Enter) en ese input, igual que si el usuario
   tecleara y diera Enter. No requiere librería adicional.
------------------------------------------------------------------------- */

function inputPistola(id){
  return `<input id="${id}" type="text" placeholder="Escanea con pistola o cámara..." autocomplete="off"><button class="btn btn-secondary" id="${id}-add" type="button">Agregar</button>`;
}
function activarInputPistola(id, onCodigo){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  const disparar = ()=>{
    const val = el.value.trim();
    if(val){ onCodigo(val); el.value = ""; el.focus(); }
  };
  el.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){ e.preventDefault(); disparar(); }
  });
  const btn = document.getElementById(id + "-add");
  if(btn) btn.addEventListener("click", disparar);
}

/* ================================ VISTAS ================================ */

function render(){
  const main = document.getElementById("main");
  document.querySelectorAll("#tabbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === state.tab && !state.view);
  });

  if(state.view){ main.innerHTML = state.view.html(); state.view.after && state.view.after(); return; }

  if(state.tab === "home") main.innerHTML = vistaHome();
  else if(state.tab === "plantillas") main.innerHTML = vistaPlantillas();
  else if(state.tab === "preinv") main.innerHTML = vistaElegirPlantillaParaConteo("preinv");
  else if(state.tab === "invfull") main.innerHTML = vistaInvCompletoIntro();
}

function irA(tab){ state.tab = tab; state.view = null; render(); }

/* ---- HOME ---- */
function vistaHome(){
  return `
    <div class="menu-tile" onclick="irA('plantillas')">
      <div class="num">01</div>
      <div class="txt"><h3>Plantillas</h3><p>Crear y administrar plantillas de productos</p></div>
    </div>
    <div class="menu-tile" onclick="irA('preinv')">
      <div class="num">02</div>
      <div class="txt"><h3>Pre-inventario</h3><p>Contar los productos de una plantilla</p></div>
    </div>
    <div class="menu-tile" onclick="irA('invfull')">
      <div class="num">03</div>
      <div class="txt"><h3>Inventario completo</h3><p>Contar todo el catálogo de la tienda</p></div>
    </div>
    <div class="card">
      <h2>Estado</h2>
      <p class="desc">
        Plantillas guardadas: <b>${state.plantillas.length}</b><br>
        Productos en catálogo PDV: <b>${Object.keys(state.productosPDV).length}</b>
      </p>
    </div>
  `;
}

/* ---- PLANTILLAS: lista ---- */
function vistaPlantillas(){
  if(state.plantillas.length === 0){
    return `<div class="empty">Aún no tienes plantillas.</div>
      <button class="btn btn-primary btn-block" onclick="crearPlantilla()">+ Crear plantilla</button>`;
  }
  const items = state.plantillas.map(p => `
    <div class="menu-tile" onclick="verPlantilla('${p.id}')">
      <div class="num">${p.productos.length}</div>
      <div class="txt"><h3>${escapeHtml(p.nombre)}</h3><p>${p.productos.length} producto(s)</p></div>
    </div>
  `).join("");
  return `${items}<button class="btn btn-secondary btn-block" onclick="crearPlantilla()">+ Crear plantilla</button>`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---- PLANTILLAS: crear (escaneando productos) ---- */
function crearPlantilla(){
  const draft = { nombre: "", productos: [] };

  function onCodigoPlantilla(codigo){
    const info = buscarProductoPorCodigo(codigo);
    if(!info){
      toast("Código no encontrado en el catálogo del PDV: " + codigo);
      return;
    }
    if(draft.productos.some(p=>p.codigo === codigo)){
      toast("Ese producto ya está en la plantilla");
      return;
    }
    draft.productos.push(info);
    document.getElementById("pl-lista").innerHTML = renderListaDraft(draft);
    toast(info.nombre + " agregado");
  }

  state.view = {
    html: ()=>`
      <div class="backline">
        <button class="back" onclick="cerrarView()">←</button>
        <div class="title">Nueva plantilla</div>
      </div>
      <div class="card">
        <div class="field">
          <label>Nombre de la plantilla</label>
          <input id="pl-nombre" placeholder="Ej. Marlboro" value="${escapeHtml(draft.nombre)}">
        </div>
        <div class="field">
          <label>Escanear producto para agregar</label>
          <div class="scan-row">
            ${inputPistola("pl-scan")}
            <button class="btn btn-secondary" onclick="window.__draftAbrirCamara()">📷</button>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Productos en esta plantilla</h2>
        <div id="pl-lista">${renderListaDraft(draft)}</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="guardarPlantillaDraft()">Guardar plantilla</button>
    `,
    after: ()=>{
      activarInputPistola("pl-scan", onCodigoPlantilla);
    }
  };
  window.__draftPlantilla = draft;
  window.__draftAbrirCamara = () => abrirCamara(onCodigoPlantilla);
  render();
}

function renderListaDraft(draft){
  if(draft.productos.length === 0) return `<div class="empty">Escanea productos para agregarlos</div>`;
  return draft.productos.map((p,i)=>`
    <div class="prod-row">
      <div class="info"><h4>${escapeHtml(p.nombre)}</h4><div class="code">${p.codigo}</div></div>
      <button class="rm" onclick="quitarDeDraft(${i})">✕</button>
    </div>
  `).join("");
}
function quitarDeDraft(i){
  window.__draftPlantilla.productos.splice(i,1);
  document.getElementById("pl-lista").innerHTML = renderListaDraft(window.__draftPlantilla);
}
function guardarPlantillaDraft(){
  const draft = window.__draftPlantilla;
  const nombre = document.getElementById("pl-nombre").value.trim();
  if(!nombre){ toast("Ponle un nombre a la plantilla"); return; }
  if(draft.productos.length === 0){ toast("Agrega al menos un producto"); return; }
  state.plantillas.push({ id: uid(), nombre, productos: draft.productos });
  guardarPlantillas();
  toast("Plantilla guardada");
  cerrarView();
  irA("plantillas");
}
function cerrarView(){ state.view = null; render(); }

function verPlantilla(id){
  const p = state.plantillas.find(x=>x.id===id);
  state.view = {
    html: ()=>`
      <div class="backline">
        <button class="back" onclick="cerrarView()">←</button>
        <div class="title">${escapeHtml(p.nombre)}</div>
      </div>
      <div class="card">
        ${p.productos.map(x=>`
          <div class="prod-row">
            <div class="info"><h4>${escapeHtml(x.nombre)}</h4><div class="code">${x.codigo}</div></div>
          </div>`).join("")}
      </div>
      <button class="btn btn-primary btn-block" onclick="iniciarConteo('${p.id}', false)">Usar para pre-inventario</button>
      <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="eliminarPlantilla('${p.id}')">Eliminar plantilla</button>
    `
  };
  render();
}
function eliminarPlantilla(id){
  state.plantillas = state.plantillas.filter(p=>p.id!==id);

}

/* ---- Inventario completo: intro ---- */

function iniciarConteoCompleto(){
  const productos = Object.entries(state.productosPDV).map(([codigo,p])=>({
    codigo, nombre: p.nombre, existenciaPDV: p.stock
  }));
  iniciarConteoConLista(productos, "Inventario completo", true);
}

/* ---- Motor de conteo (compartido por pre-inventario e inventario completo) ----
   Regla clave: si el mismo código se escanea varias veces durante la sesión,
   las cantidades ingresadas se SUMAN al acumulado de ese producto, no se
   reemplazan. Esto cubre el caso de encontrar el mismo producto en distintos
   lugares de la tienda.

   El pre-inventario es solo de control/comparación: NUNCA escribe en el stock
   real del PDV, sin importar qué tan grandes sean las diferencias que
   encuentre. Solo el inventario completo (aplicaStock=true) ajusta el stock
   real al finalizar.
--------------------------------------------------------------------------- */

let sesionActual = null;

function iniciarConteo(plantillaId){
  const p = state.plantillas.find(x=>x.id===plantillaId);
  iniciarConteoConLista(p.productos.map(x=>({...x})), p.nombre, false);
}

function iniciarConteoConLista(productos, etiqueta, aplicaStock){
  sesionActual = {
    etiqueta,
    aplicaStock: !!aplicaStock,
    // aplicado = cuánta corrección ya se escribió en el PDV para este producto
    // en esta sesión (se compara contra el nuevo total cada vez que se cuenta
    // de nuevo, para escribir solo la diferencia que falta).
    productos: productos.map(p=>({ ...p, contado: 0, tocado: false, aplicado: 0, sincronizado: false })),
  };
  renderVistaConteo();
}

function renderVistaConteo(){
  state.view = {
    html: ()=>`
      <div class="backline">
        <button class="back" onclick="cancelarConteo()">←</button>
        <div class="title">${escapeHtml(sesionActual.etiqueta)}</div>
      </div>
      <div class="card">
        <div class="field">
          <label>Escanear producto</label>
          <div class="scan-row">
            ${inputPistola("cnt-scan")}
            <button class="btn btn-secondary" onclick="abrirCamara(codigoEscaneadoConteo)">📷</button>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Productos (${sesionActual.productos.filter(p=>p.tocado).length}/${sesionActual.productos.length} contados)</h2>
        <div id="cnt-lista">${renderListaConteo()}</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="finalizarConteo()">Finalizar conteo</button>
    `,
    after: ()=> activarInputPistola("cnt-scan", codigoEscaneadoConteo)
  };
  render();
}

function renderListaConteo(){
  return sesionActual.productos.map((p,i)=>{
    let marca = "";
    if(p.tocado){
      marca = p.sincronizado
        ? '<span class="badge" style="color:#1E7A46;background:#E4F3EA;">aplicado ✓</span>'
        : '<span class="badge" style="color:#4A5568;background:#EDF0F2;">contado, se aplica al finalizar</span>';
    }
    return `
    <div class="count-row ${p.tocado?'done':''}">
      <div class="info"><h4>${escapeHtml(p.nombre)}${marca}</h4><div class="meta">${p.codigo} · debería haber ${p.existenciaPDV}</div></div>
      <div class="acc">${p.contado}</div>
    </div>`;
  }).join("");
}

window.codigoEscaneadoConteo = function(codigo){
  const idx = sesionActual.productos.findIndex(p=>p.codigo === codigo);
  if(idx === -1){
    toast("Este producto no está en el conteo actual");
    return;
  }
  pedirCantidad(sesionActual.productos[idx]);
};

async function pedirCantidad(prod){
  const cantidad = window.prompt(`${prod.nombre}\n¿Cuántos encontraste ahora?`, "1");
  if(cantidad === null) return;
  const n = parseInt(cantidad, 10);
  if(isNaN(n) || n < 0){ toast("Cantidad no válida"); return; }
  prod.contado += n;      // se SUMA a lo ya contado antes de este producto
  prod.tocado = true;
  prod.sincronizado = false;
  document.getElementById("cnt-lista").innerHTML = renderListaConteo();
  toast(`${prod.nombre}: ${prod.contado} acumulado (se aplica al finalizar el conteo)`);
}

/* --------------------------------------------------------------------------
   Aplica la corrección de un producto contra el PDV. Esto ya NO se llama por
   cada cantidad capturada — el stock del PDV se queda intacto mientras se
   sigue contando, para no bloquear ventas en caja con conteos a medias
   (ej. el mismo producto está repartido en varios lugares de la tienda y
   todavía falta contarlo en otro anaquel). Se llama una sola vez por
   producto hasta que se presiona "Finalizar conteo".

   Aun así, se calcula como diferencia (delta), no como reemplazo:

     correctionTotal = contado_acumulado - existenciaPDV (baseline al iniciar)
     delta_por_escribir = correctionTotal - lo_que_ya_se_aplicó_antes

   y se suma ese delta al stock EN VIVO (leído justo antes de escribir), no
   al stock que teníamos cacheado al abrir la app. Así, si en caja se vendió
   algo de este producto mientras duró todo el conteo, esa venta queda
   reflejada: el ajuste se compone sobre el stock real del momento en que
   se finaliza, no lo borra.
   -------------------------------------------------------------------------- */
async function aplicarCorreccionInmediata(prod){
  const correctionTotal = prod.contado - prod.existenciaPDV;
  const deltaPorEscribir = correctionTotal - prod.aplicado;
  if(deltaPorEscribir === 0){ prod.sincronizado = true; return; }
  if(!state.uid){
    toast("No conectado al PDV: este conteo se guarda pero no se sincroniza todavía");
    return;
  }
  try{
    const info = await leerStockEnVivoConLlave(prod.codigo);
    if(!info){
      prod.sincronizado = false;
      toast(prod.nombre + " ya no existe en el PDV — no se pudo sincronizar");
      return;
    }
    const nuevoStock = info.stock + deltaPorEscribir;
    await aplicarAjusteStock(prod.codigo, info.key, nuevoStock);
    prod.aplicado = correctionTotal;
    prod.sincronizado = true;
    if(state.productosPDV[prod.codigo]) state.productosPDV[prod.codigo].stock = nuevoStock;
    toast(`${prod.nombre}: stock del PDV actualizado a ${nuevoStock}`);
  }catch(e){
    prod.sincronizado = false;
    toast("No se pudo sincronizar " + prod.nombre + ": " + e.message);
  }
}

// Reintenta sincronizar cualquier producto contado que se haya quedado
// pendiente (ej. por no estar conectado al PDV en ese momento).
async function reintentarPendientes(){
  const pendientes = sesionActual.productos.filter(p=>p.tocado && !p.sincronizado);
  if(pendientes.length === 0){ toast("No hay pendientes"); return; }
  for(const p of pendientes){ await aplicarCorreccionInmediata(p); }
  document.getElementById("cnt-lista") && (document.getElementById("cnt-lista").innerHTML = renderListaConteo());
  toast("Sincronización reintentada");
}

function cancelarConteo(){
  if(confirm("¿Cancelar este conteo? Se perderá lo capturado.")){
    sesionActual = null;
    cerrarView();
    irA("home");
  }
}

async function finalizarConteo(){
  const tocados = sesionActual.productos.filter(p=>p.tocado);

  // El pre-inventario es solo de control: se muestra la comparación y no se
  // toca el stock real del PDV. Solo el inventario completo escribe.
  if(!sesionActual.aplicaStock){
    mostrarResultadoConteo(tocados, []);
    return;
  }

  // Aquí, y no antes, es cuando se escribe en el PDV: se aplica la corrección
  // de cada producto contado, una sola vez, leyendo el stock en vivo de cada
  // uno justo antes de escribir (así las ventas hechas en caja durante todo
  // el conteo quedan reflejadas, y el stock no se movió mientras contabas).
  state.view = {
    html: ()=>`
      <div class="backline">
        <div class="title">${escapeHtml(sesionActual.etiqueta)}</div>
      </div>
      <div class="card"><p class="desc">Aplicando el conteo al PDV...</p></div>
    `
  };
  render();

  for(const p of tocados){ await aplicarCorreccionInmediata(p); }

  const pendientes = sesionActual.productos.filter(p=>p.tocado && !p.sincronizado);
  mostrarResultadoConteo(tocados, pendientes);
}

function mostrarResultadoConteo(tocados, pendientes){
  const esSoloControl = !sesionActual.aplicaStock;
  state.view = {
    html: ()=>`
      <div class="backline">
        <button class="back" onclick="renderVistaConteo()">←</button>
        <div class="title">Resultado — ${escapeHtml(sesionActual.etiqueta)}</div>
      </div>
      ${pendientes.length > 0 ? `
        <div class="card" style="border-color:#B7791F;">
          <h2>⚠ ${pendientes.length} producto(s) sin sincronizar</h2>
          <p class="desc">No se pudieron escribir en el PDV (probablemente sin conexión). El stock del PDV todavía NO tiene este ajuste.</p>
          <button class="btn btn-secondary btn-block" onclick="reintentarYVolverAResultado()">Reintentar sincronizar</button>
        </div>` : ''}
      <div class="card">
        <p class="desc" style="margin-bottom:14px;">
          ${esSoloControl
            ? 'Esto es un pre-inventario de control: solo compara lo contado contra el catálogo, el stock real del PDV <b>no se modificó</b>. Si quieres que estas diferencias se apliquen de verdad, hazlo desde "Inv. completo".'
            : 'El stock del PDV se quedó igual durante todo el conteo y recién se ajustó ahora, al finalizar, sumando o restando sobre el stock real de este momento (así las ventas hechas en caja mientras contabas ya quedan reflejadas).'}
        </p>
        ${tocados.map(p=>{
          const dif = p.contado - p.existenciaPDV;
          const cls = dif===0 ? 'diff-zero' : (dif>0?'diff-pos':'diff-neg');
          const signo = dif>0 ? '+'+dif : dif;
          return `<div class="count-row">
            <div class="info"><h4>${escapeHtml(p.nombre)}</h4><div class="meta">al iniciar: ${p.existenciaPDV} · contado: ${p.contado}</div></div>
            <div class="acc ${cls}">${signo}</div>
          </div>`;
        }).join("") || '<div class="empty">No contaste ningún producto</div>'}
      </div>
      <button class="btn btn-primary btn-block" onclick="terminarConteo()">Terminar</button>
    `
  };
  render();
}

async function reintentarYVolverAResultado(){
  await reintentarPendientes();
  finalizarConteo();
}

async function terminarConteo(){
  await cargarCatalogoPDV();
  sesionActual = null;
  cerrarView();
  irA("home");
}

async function hacerLogin(){
  const email = document.getElementById("cfg-email").value.trim();
  const pass = document.getElementById("cfg-pass").value;
  if(!email || !pass){ toast("Completa correo y contraseña"); return; }
  try{
    await loginPDV(email, pass);
    toast("Conectado al PDV");
    cerrarView();
    irA("home");
  }catch(e){
    toast("No se pudo conectar: " + e.message);
  }
}
async function hacerLogout(){
  const f = window.__fb;
  await f.signOut(fbAuth);
  cerrarView();
  irA("home");
}
